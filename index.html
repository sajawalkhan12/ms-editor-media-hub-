<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS Editor Media Hub</title><style>
:root{--bg:#0c2927;--panel:#123a36;--line:#3b6a64;--muted:#bad2cc;--pink:#f05b91;--gold:#f5d779}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:15px system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}.brand{text-align:center;background:#b8d8cb;color:#09211f;font-size:clamp(27px,5vw,52px);font-weight:950;padding:12px 5px}.cover{height:clamp(150px,28vw,280px);background:linear-gradient(90deg,#061b1bd9,#0c292755),url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1600&q=85') center/cover;display:flex;align-items:end;padding:20px}.cover h1{margin:0;font-size:clamp(22px,4vw,38px)}.wrap{max-width:1150px;margin:auto;padding:0 12px 80px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cat{white-space:nowrap;border:2px solid #d5e9e4;border-radius:30px;background:transparent;color:#fff;padding:8px 14px;font-weight:800}.cat.active{background:#fff;color:#173e39}.banner{height:clamp(120px,21vw,210px);background:linear-gradient(0deg,#051b1bdc,transparent 70%),url('https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1500&q=80') center/cover;border-radius:10px;display:flex;align-items:end;padding:18px;margin:8px 0 22px}.banner h2{margin:0}.section{margin:23px 0}.st{border-bottom:2px solid var(--line);padding-bottom:8px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}.post{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}.thumb{height:clamp(110px,22vw,200px);background:#234944;display:grid;place-items:center}.thumb img{width:100%;height:100%;object-fit:cover}.body{padding:9px}.body h3{font-size:14px;margin:0 0 5px;overflow-wrap:anywhere}.desc{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.btn{border:0;border-radius:8px;padding:8px 10px;background:#24574f;color:#fff;margin:3px 2px 0 0;font-size:12px}.del{background:#8a3040}.empty{grid-column:1/-1;padding:20px;text-align:center;border:1px dashed var(--line);color:var(--muted)}.fab{position:fixed;right:15px;bottom:15px;border:0;border-radius:30px;background:var(--pink);padding:13px 18px;font-weight:900;z-index:5}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.sheet{width:min(620px,100%);max-height:92vh;overflow:auto;background:#103631;border:1px solid #548078;border-radius:16px;padding:17px}.close{float:right;background:#315b54;color:white;border:0;border-radius:7px;padding:7px}.field{display:grid;gap:5px;margin:12px 0}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #4c766e;border-radius:8px;background:#092522;color:white}.field textarea{min-height:75px}.primary{background:var(--gold);color:#1c2924;border:0;border-radius:9px;padding:10px 14px;font-weight:900}.hint,.status{font-size:12px;color:var(--muted);white-space:pre-wrap}.hidden{display:none!important}
</style></head><body>
<div class="brand">MS Editor Media Hub</div><header class="cover"><div><h1>Movies • Music • Creative Prompts</h1><p>One home for your media library</p></div></header>
<main class="wrap"><nav class="cats" id="cats"></nav><section class="banner"><div><h2>Explore the Media Hub</h2><p>Watch • Listen • Discover</p></div></section><div id="sections"></div></main>
<button class="fab" onclick="openAdmin()">⚙ Admin</button>
<div class="modal" id="modal" onclick="if(event.target===this)closeAdmin()"><div class="sheet"><button class="close" onclick="closeAdmin()">Close</button><h2>Admin Panel</h2><div id="loginBox"><p class="hint">Sign in with your existing Supabase admin account.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="primary" onclick="login()">Admin Login</button></div>
<div id="uploadBox" class="hidden"><p>Admin signed in <button class="btn" onclick="logout()">Sign out</button></p><div class="field"><label>Post title *</label><input id="title"></div><div class="field"><label>Category</label><select id="type"><option value="image_prompt">Image Prompt</option><option value="movie">Full Movie</option><option value="trailer">Movie Trailer</option><option value="tutorial">Video Tutorial</option><option value="song">Video Songs</option><option value="video_prompt">Video Prompt</option><option value="image">Image</option><option value="audio">Audio Song</option></select></div><div class="field"><label>Description / prompt</label><textarea id="description"></textarea></div><div class="field"><label>Video / image / audio file</label><input id="file" type="file" accept="video/*,image/*,audio/*"></div><div class="field"><label>Poster / cover image (optional)</label><input id="poster" type="file" accept="image/*"></div><div class="field"><label>External URL (optional)</label><input id="external" type="url" placeholder="https://..."></div><button class="primary" id="upbtn" onclick="uploadPost()">Upload Post</button><p id="status" class="status"></p></div></div></div>
<script>
/* Use ONLY the public publishable key here, never a service_role/sb_secret key. */
const URL_BASE="https://mgjrrgsbddppffnvnmgs.supabase.co";
const PUBLISHABLE_KEY=  "sb_publishable_itipFHFloN9JGgcW4wffvA_LjDoGoGr"
const BUCKET="media";
const cats=[["all","All"],["image_prompt","Image Prompt"],["movie","Full Movie"],["trailer","Movie Trailer"],["tutorial","Video Tutorial"],["song","Video Songs"],["video_prompt","Video Prompt"],["audio","Audio Songs"],["image","Images"]];
let active="all",posts=[],token="",user=null,isAdmin=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ready=()=>PUBLISHABLE_KEY&&!PUBLISHABLE_KEY.includes("PASTE_YOUR");
const label=k=>(cats.find(x=>x[0]===k)||[k,k])[1];
function authHeaders(){return {apikey:PUBLISHABLE_KEY,Authorization:"Bearer "+(token||PUBLISHABLE_KEY)}}
async function api(path,opt={}){let r=await fetch(URL_BASE+path,{...opt,headers:{...authHeaders(),...(opt.headers||{})}}),t=await r.text(),d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.msg||d?.hint||String(t||r.status));return d}
function pub(path){return path?(/^https?:\/\//i.test(path)?path:URL_BASE+"/storage/v1/object/public/"+BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/")):""}
function buildCats(){ $("cats").innerHTML=cats.map(([k,v])=>`<button class="cat ${active===k?"active":""}" onclick="setCat('${k}')">${v}</button>`).join("")}
function setCat(k){active=k;buildCats();render()}
function render(){let keys=active==="all"?cats.slice(1).map(x=>x[0]):[active];$("sections").innerHTML=keys.map(k=>{let a=posts.filter(p=>p.media_type===k);return `<section class="section"><h2 class="st">${label(k)} <small style="color:#bad2cc;font-size:12px">${a.length} posts</small></h2><div class="grid">${a.length?a.map(card).join(""):'<div class="empty">No posts in this category yet.</div>'}</div></section>`}).join("")}
function card(p){let media=pub(p.storage_path)||p.external_url||"",poster=pub(p.poster_path)||(p.media_type==="image"||p.media_type==="image_prompt"?media:"");let preview=poster?`<img src="${esc(poster)}" alt="${esc(p.title)}">`:(p.media_type==="audio"?"♫":"▶");let player=p.media_type==="audio"&&media?`<audio controls style="width:100%" src="${esc(media)}"></audio>`:media&&/\.(mp4|webm|ogg)(\?|$)/i.test(media)?`<video controls preload="none" style="width:100%;max-height:220px" src="${esc(media)}"></video>`:"";return `<article class="post"><div class="thumb">${preview}</div><div class="body"><h3>${esc(p.title)}</h3><small>${esc(label(p.media_type))}</small>${p.description?`<p class="desc">${esc(p.description)}</p>`:""}${player}<div>${(p.media_type==="video_prompt"||p.media_type==="image_prompt")&&p.description?`<button class="btn" onclick="copyPrompt('${p.id}')">Copy Prompt</button>`:""}${media?`<a class="btn" href="${esc(media)}" download>Download</a>`:""}${isAdmin?`<button class="btn del" onclick="deletePost('${p.id}')">🗑 Delete</button>`:""}</div></div></article>`}
async function loadPosts(){if(!ready()){$("sections").innerHTML='<div class="empty">Setup needed: add your Supabase publishable key in this file, then publish again.</div>';return}try{posts=await api("/rest/v1/media_items?select=*&order=created_at.desc")||[];buildCats();render()}catch(e){$("sections").innerHTML=`<div class="empty">Could not load posts: ${esc(e.message)}</div>`}}
function openAdmin(){$("modal").classList.add("open")}
function closeAdmin(){$("modal").classList.remove("open")}
async function login(){if(!ready()){$("status").textContent="Add the publishable key in the HTML first.";return}try{$("status").textContent="Signing in…";let r=await fetch(URL_BASE+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.message||d.error_description||"Login failed");token=d.access_token;user=d.user;let a=await api("/rest/v1/admin_users?user_id=eq."+encodeURIComponent(user.id)+"&select=user_id");if(!a.length)throw Error("This user is not authorized in admin_users.");isAdmin=true;$("loginBox").classList.add("hidden");$("uploadBox").classList.remove("hidden");$("status").textContent="Admin login successful.";render()}catch(e){token="";user=null;isAdmin=false;$("status").textContent="Login error: "+e.message}}
function logout(){token="";user=null;isAdmin=false;$("uploadBox").classList.add("hidden");$("loginBox").classList.remove("hidden");render()}
function clean(s){return s.replace(/[^\w.-]+/g,"_").slice(-90)||"file"}
async function storeFile(f,path){let r=await fetch(URL_BASE+"/storage/v1/object/"+BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/"),{method:"POST",headers:{...authHeaders(),"Content-Type":f.type||"application/octet-stream"},body:f}),t=await r.text();if(!r.ok)throw Error(t||"Storage upload failed")}
async function uploadPost(){if(!isAdmin)return;let title=$("title").value.trim(),type=$("type").value,desc=$("description").value.trim(),f=$("file").files[0],poster=$("poster").files[0],external=$("external").value.trim();if(!title){$("status").textContent="Enter a title.";return}if(!f&&!external){$("status").textContent="Choose a file or add an external URL.";return}let paths=[];$("upbtn").disabled=true;$("status").textContent="Uploading…";try{let storage="",posterPath="";if(f){storage=user.id+"/"+Date.now()+"_"+clean(f.name);await storeFile(f,storage);paths.push(storage)}if(poster){posterPath=user.id+"/poster_"+Date.now()+"_"+clean(poster.name);await storeFile(poster,posterPath);paths.push(posterPath)}await api("/rest/v1/media_items",{method:"POST",headers:{"Content-Type":"application/json","Prefer":"return=representation"},body:JSON.stringify({title,description:desc,media_type:type,storage_path:storage||null,external_url:external||null,poster_path:posterPath||null,created_by:user.id})});$("title").value="";$("description").value="";$("file").value="";$("poster").value="";$("external").value="";$("status").textContent="Upload successful!";await loadPosts()}catch(e){$("status").textContent="Upload failed: "+e.message}finally{$("upbtn").disabled=false}}
async function deletePost(id){let p=posts.find(x=>String(x.id)===String(id));if(!isAdmin||!p)return;if(!confirm('Permanently delete "'+p.title+'"?'))return;try{await api("/rest/v1/media_items?id=eq."+encodeURIComponent(id),{method:"DELETE"});posts=posts.filter(x=>String(x.id)!==String(id));render();let paths=[p.storage_path,p.poster_path].filter(x=>x&&!/^https?:/i.test(x));for(let path of paths){let r=await fetch(URL_BASE+"/storage/v1/object/"+BUCKET+"/"+path.split("/").map(encodeURIComponent).join("/"),{method:"DELETE",headers:authHeaders()});if(!r.ok)console.warn("Post removed; file cleanup may need checking.")}alert("Post deleted.")}catch(e){alert("Delete failed: "+e.message)}}
function copyPrompt(id){let p=posts.find(x=>String(x.id)===String(id));if(!p)return;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(p.description||"").then(()=>alert("Prompt copied")).catch(()=>prompt("Copy prompt:",p.description||""));else prompt("Copy prompt:",p.description||"")}
buildCats();loadPosts();
</script></body></html>
